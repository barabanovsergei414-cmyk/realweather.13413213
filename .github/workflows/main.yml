name: Build Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip mod sources
        run: unzip "realisticexplosions (1).zip" -d unpacked

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build with Gradle
        working-directory: unpacked/realisticexplosions
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: realisticexplosions-jar
          path: unpacked/realisticexplosions/build/libs/*-1.0.0.jar
          if-no-files-found: error
